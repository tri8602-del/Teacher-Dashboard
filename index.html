function lessonPlanRowEditor(r){const ds=[1,2,3,4,5];const linked=new Set(r.classIds||[]);const classChecks=data.classes.length?`<div class="lessonClassChecks lpRowClasses"><span class="small">Use this plan on Live Class for:</span>${data.classes.map(c=>`<label><input class="lpRowClass" type="checkbox" value="${c.id}" ${linked.has(c.id)?'checked':''}> ${esc(c.nickname||c.name)}</label>`).join('')}</div>`:'';return `<div class="lessonPlanRowEditor" data-row-id="${esc(r.id)}"><div class="lessonPlanRowEditorHead"><input type="text" class="lpRowName" value="${esc(r.name)}" placeholder="e.g., PLT"><button type="button" onclick="this.closest('.lessonPlanRowEditor').remove()">Remove</button></div><div class="lessonDayPick">${ds.map(d=>`<label><input class="lpRowDay" type="checkbox" value="${d}" ${(r.days||[]).includes(d)?'checked':''}> ${['Mon','Tue','Wed','Thu','Fri'][d-1]}</label>`).join('')}</div><div class="lessonRowMeta"><label>Period (optional) <input class="lpRowPeriod" type="number" min="1" max="12" value="${r.period||''}" placeholder="6" style="width:70px"></label><span class="small">Period helps the planner recognize AM/PM subs and alternate schedules.</span></div>${classChecks}</div>`;}
window.addLessonPlanRow=()=>{const host=document.querySelector('#lessonRowList');if(!host)return;host.querySelector('.emptyRows')?.remove();const id='lp_'+uid();host.insertAdjacentHTML('beforeend',lessonPlanRowEditor({id,name:'',days:[1,2,3,4,5],period:0}));};
window.closeLessonPlanManager=()=>document.querySelector('#lessonPlanModal')?.remove();
window.saveLessonPlanManager=()=>{ensureLessonPlans();const visible=new Set([...document.querySelectorAll('.lessonPlanClassVisible:checked')].map(x=>x.value));data.lessonPlanHiddenClassIds=data.classes.filter(c=>!visible.has(c.id)).map(c=>c.id);data.lessonPlanSyncGroups=[...document.querySelectorAll('#lessonSyncList .lessonSyncEditor')].map((el,i)=>({id:el.dataset.syncId||'sync_'+uid(),name:el.querySelector('.lessonSyncName').value.trim()||`Linked Row ${i+1}`,classIds:[...el.querySelectorAll('.lessonClassChecks input:checked')].map(x=>x.value)})).filter(g=>g.classIds.length>1);const rows=[...document.querySelectorAll('#lessonRowList .lessonPlanRowEditor')].map((el,i)=>({id:el.dataset.rowId||uid(),name:el.querySelector('.lpRowName').value.trim()||`Planning Row ${i+1}`,days:[...el.querySelectorAll('.lpRowDay:checked')].map(x=>Number(x.value)),period:Number(el.querySelector('.lpRowPeriod').value)||0,classIds:[...el.querySelectorAll('.lpRowClass:checked')].map(x=>x.value)})).filter(r=>r.days.length);data.lessonPlanCustomRows=rows;save();window.closeLessonPlanManager();render();};;




// --- Printable records/forms (3.0.4) ---
function printDocument(title, body, landscape=false){
  const w=window.open("","_blank","width=1000,height=800");
  if(!w){alert("Please allow pop-ups for Teacher Dashboard so the printable document can open.");return;}
  const pageCSS=`
    @page{size:${landscape?"landscape":"portrait"};margin:${landscape?"0.3in":"0.45in"}}
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:#fff;color:#172033}
    body{font-family:Arial,'Segoe UI',Calibri,sans-serif;font-size:10pt;line-height:1.35;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .printOnlyDoc{width:100%;max-width:100%;margin:0 auto}
    .printOnlyDoc h1{font-size:19pt;line-height:1.15;margin:0 0 5px;font-weight:800;color:#172033}
    .printOnlyDoc h2{font-size:12pt;line-height:1.2;margin:15px 0 6px;padding:0 0 4px;border-bottom:2px solid #c9d1dc;color:#26364d}
    .printOnlyDoc p{margin:4px 0}
    .printOnlyDoc .printMeta{font-size:9.5pt;color:#596579}
    .printOnlyDoc table{width:100%;border-collapse:collapse;font-size:9pt;line-height:1.25}
    .printOnlyDoc th,.printOnlyDoc td{border:1px solid #cbd3de;padding:5px 6px;vertical-align:top;overflow-wrap:break-word}
    .printOnlyDoc th{background:#eef2f6;text-align:left;font-weight:700;color:#26364d}
    .printOnlyDoc tbody tr:nth-child(even) td{background:#f8fafc}
    .printOnlyDoc thead{display:table-header-group}
    .printOnlyDoc tr{break-inside:avoid;page-break-inside:avoid}
    .printOnlyDoc .blankLine{display:inline-block;border-bottom:1px solid #667085;min-width:190px;height:13px}
    .printOnlyDoc .small{font-size:8pt;color:#667085}
    .printOnlyDoc .formTrackerTitle{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;border-bottom:2px solid #1f3a5f;padding-bottom:8px;margin-bottom:8px}
    .printOnlyDoc .formTrackerTitle h1{margin:0}
    .printOnlyDoc .trackerBadge{font-size:9pt;font-weight:700;color:#1f3a5f;white-space:nowrap}
    .printOnlyDoc .trackerTable{table-layout:auto}
    .printOnlyDoc .trackerTable th:first-child,.printOnlyDoc .trackerTable td:first-child{min-width:145px}
    .printOnlyDoc .trackerTable th:nth-child(2),.printOnlyDoc .trackerTable td:nth-child(2){width:62px;text-align:center}
    .printOnlyDoc .trackerTable th:nth-child(3),.printOnlyDoc .trackerTable td:nth-child(3){width:105px}
    .printOnlyDoc .trackerTable th:nth-child(4),.printOnlyDoc .trackerTable td:nth-child(4){width:92px;white-space:nowrap}
    .printOnlyDoc .checkMark{font-size:12pt;font-weight:700}
    .printOnlyDoc .formSheet{max-width:7.1in;margin:0 auto}
    @media screen{body{background:#f5f7fa}.printOnlyDoc{background:#fff;padding:18px;min-height:100vh;box-shadow:0 2px 14px rgba(0,0,0,.08)}}
    @media print{.noPrint{display:none!important}.printOnlyDoc{box-shadow:none!important;padding:0!important}.formTrackerTitle{break-after:avoid;page-break-after:avoid}}
  `;
  w.document.open();
  w.document.write(`<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(title)}</title><style>${pageCSS}</style></head><body><div class="printOnlyDoc">${body}</div><script>window.addEventListener('load',()=>setTimeout(()=>window.print(),250));<\/script></body></html>`);
  w.document.close();
}
function printableFieldValue(value,field){
  if(value===undefined||value===null||value==="")return "";
  if(field.type==="checkbox")return value?"Yes":"No";
  if(field.type==="checkboxes"&&Array.isArray(value))return value.join(", ");
  if(field.type==="dropdown"&&String(value).startsWith("__OTHER__:"))return String(value).slice(10);
  return String(value);
}
window.printForm=(id)=>{
  ensureForms();const f=data.forms.find(x=>x.id===id);if(!f)return;
  const targetCount=formStudentIds(f).length;
  const fields=f.fields||[];
  const fieldRows=fields.map(x=>`<tr><th>${esc(x.label)}</th><td style="height:${x.type==="notes"||x.type==="longtext"?"48px":"24px"}"></td></tr>`).join("");
  const body=`<h1>${esc(f.name)}</h1>${f.description?`<p>${esc(f.description)}</p>`:""}<p class="printMeta"><b>Student:</b> <span class="blankLine"></span> &nbsp;&nbsp; <b>Date:</b> <span class="blankLine" style="min-width:100px"></span></p>${f.dueDate?`<p class="printMeta"><b>Due date:</b> ${esc(f.dueDate)}</p>`:""}<h2>Information</h2><table><tbody>${fieldRows||`<tr><td style="height:60px"></td></tr>`}</tbody></table><h2>Signature / Return</h2><table><tbody><tr><th style="width:35%">Signature</th><td style="height:26px"></td></tr><tr><th>Date</th><td style="height:24px"></td></tr><tr><th>Additional notes</th><td style="height:55px"></td></tr></tbody></table><p class="printMeta" style="margin-top:10px">This form is intended for printing and completing by hand. ${targetCount?`This form is assigned to ${targetCount} student${targetCount===1?"":"s"}.`:""}</p>`;
  printDocument(f.name,body,false);
};
window.printFormTracker=(id)=>{
  ensureForms();normalizeStudents();const f=data.forms.find(x=>x.id===id);if(!f)return;
  const students=sortedStudents(data.students.filter(s=>formStudentIds(f).includes(s.id)));
  const cols=f.fields||[];
  const receivedCount=students.filter(s=>f.records[s.id]?.received).length;
  const head=`<tr><th>Student</th><th>Received</th><th>Method</th><th>Date Received</th>${cols.map(x=>`<th>${esc(x.label)}</th>`).join("")}</tr>`;
  const rows=students.map(s=>{const r=f.records[s.id]||{};return `<tr><td><b>${esc(studentDisplayName(s))}</b></td><td class="checkMark">${r.received?"✓":""}</td><td>${esc(r.method||"")}</td><td>${esc(r.receivedDate||"")}</td>${cols.map(x=>`<td>${esc(printableFieldValue(r[x.id],x))}</td>`).join("")}</tr>`;}).join("");
  const body=`<div class="formTrackerTitle"><div><h1>${esc(f.name)} — Tracker</h1>${f.description?`<p class="printMeta">${esc(f.description)}</p>`:""}</div><div class="trackerBadge">${receivedCount} / ${students.length} received${f.dueDate?` · Due ${esc(f.dueDate)}`:""}</div></div><table class="trackerTable"><thead>${head}</thead><tbody>${rows||`<tr><td colspan="${4+cols.length}">No students selected.</td></tr>`}</tbody></table>`;
  printDocument(`${f.name} - Tracker`,body,true);
};
function accommodationPrintRecords(studentId){
  ensureAccommodations();return data.accommodations.filter(a=>a.studentId===studentId&&a.active!==false).sort((a,b)=>(a.category||"").localeCompare(b.category||"")||(a.text||"").localeCompare(b.text||""));
}
function accommodationPrintRows(records,includeTracker){
  return records.map(a=>`<tr><td>${esc(a.category)}</td><td><b>${esc(accommodationMatrixLabel(a))}</b></td><td>${esc(a.text)}${a.details?`<div class="small">${esc(a.details)}</div>`:""}</td>${includeTracker?`<td style="min-width:95px"><span class="checkBox"></span> Implemented<br><span class="checkBox"></span> Needs follow-up</td><td style="min-width:120px"></td>`:""}</tr>`).join("");
}
window.printAccommodationStudent=(studentId,includeTracker=false)=>{
  ensureAccommodations();normalizeStudents();const st=data.students.find(s=>s.id===studentId);if(!st)return;
  const records=accommodationPrintRecords(studentId);if(!records.length){alert("This student has no active accommodation or service records to print.");return;}
  const title=`${studentDisplayName(st)} — Accommodations`;
  const body=`<h1>${esc(studentDisplayName(st))}</h1><p class="printMeta">Active accommodations and services · Printed ${new Date().toLocaleDateString()}</p><table class="accomPrintTable"><thead><tr><th>Category</th><th>Quick Reference</th><th>${includeTracker?"Accommodation / Service":"Accommodation / Service"}</th>${includeTracker?"<th style=\"width:13%\">Implementation</th><th style=\"width:18%\">Notes</th>":""}</tr></thead><tbody>${accommodationPrintRows(records,includeTracker)}</tbody></table>${includeTracker?`<h2>Implementation Notes</h2><div class="notesSpace"></div>`:""}`;
  printDocument(title,body,false);
};
window.printAccommodationClassMatrix=(classId)=>{
  ensureAccommodations();normalizeStudents();const cls=data.classes.find(c=>c.id===classId);if(!cls)return;
  const cats=accommodationDisplayCategories();
  const students=sortedStudents(data.students.filter(s=>(cls.studentIds||[]).includes(s.id))).filter(s=>accommodationPrintRecords(s.id).length);
  const rows=students.map(st=>{const recs=accommodationPrintRecords(st.id);return `<tr><td><b>${esc(studentDisplayName(st))}</b></td>${cats.map(cat=>{const items=recs.filter(a=>a.category===cat);return `<td>${items.map(a=>`<span class="pill">${esc(accommodationMatrixLabel(a))}</span>`).join("")}</td>`;}).join("")}</tr>`;}).join("");
  const body=`<h1>${esc(cls.name)} — Accommodation Matrix</h1><p class="printMeta">Active records only · ${students.length} student${students.length===1?"":"s"} · Printed ${new Date().toLocaleDateString()}</p><table class="matrixPrint"><thead><tr><th>Student</th>${cats.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${rows||`<tr><td colspan="${cats.length+1}">No active accommodation records for students in this class.</td></tr>`}</tbody></table>`;
  printDocument(`${cls.name} - Accommodation Matrix`,body,true);
};
window.openAccommodationPrintMenu=()=>{
  ensureAccommodations();normalizeStudents();ensureClassFields();
  const activeStudents=sortedStudents(data.students.filter(s=>accommodationPrintRecords(s.id).length));
  const classes=data.classes.slice().sort((a,b)=>(a.name||"").localeCompare(b.name||""));
  const selectedStudent=window.accommodationStudentFilter&&window.accommodationStudentFilter!=="all"?window.accommodationStudentFilter:"";
  const selectedClass=window.accommodationClassFilter&&window.accommodationClassFilter!=="all"?window.accommodationClassFilter:"";
  const studentOptions=activeStudents.map(s=>`<option value="${esc(s.id)}" ${selectedStudent===s.id?"selected":""}>${esc(studentDisplayName(s))}</option>`).join("");
  const classOptions=classes.map(c=>`<option value="${esc(c.id)}" ${selectedClass===c.id?"selected":""}>${esc(c.name)}</option>`).join("");
  document.querySelector("#accommodationPrintMenuModal")?.remove();
  document.body.insertAdjacentHTML("beforeend",`<div id="accommodationPrintMenuModal" class="modalbg"><div class="modal accommodationModal printMenuPanel"><div class="modalHead"><div><h3>🖨 Print Accommodations</h3><div class="small">Choose a student reference or a class matrix.</div></div><button type="button" onclick="window.closeAccommodationPrintMenu()">×</button></div><div class="modalBody"><div class="printMenuGrid"><button type="button" class="printMenuOption" onclick="window.printAccommodationFromMenu(false)"><b>Student Reference</b><span class="small">One-page active accommodation reference for a student.</span></button><button type="button" class="printMenuOption" onclick="window.printAccommodationFromMenu(true)"><b>Student Reference + Tracker</b><span class="small">Reference sheet with implementation checkboxes and notes.</span></button><button type="button" class="printMenuOption" onclick="window.printAccommodationClassFromMenu()"><b>Class Matrix</b><span class="small">Landscape matrix showing active students and quick-reference labels.</span></button></div><div class="reportControls" style="margin-top:14px"><label>Student for student print<br><select id="accommodationPrintStudent"><option value="">Choose a student…</option>${studentOptions}</select></label><label>Class for matrix print<br><select id="accommodationPrintClass"><option value="">Choose a class…</option>${classOptions}</select></label></div></div><div class="modalActions"><button type="button" onclick="window.closeAccommodationPrintMenu()">Close</button></div></div></div>`);
};
window.closeAccommodationPrintMenu=()=>document.querySelector("#accommodationPrintMenuModal")?.remove();
window.printAccommodationFromMenu=(tracker)=>{const id=document.getElementById("accommodationPrintStudent")?.value;if(!id){alert("Choose a student first.");return;}window.closeAccommodationPrintMenu();window.printAccommodationStudent(id,tracker);};
window.printAccommodationClassFromMenu=()=>{const id=document.getElementById("accommodationPrintClass")?.value;if(!id){alert("Choose a class first.");return;}window.closeAccommodationPrintMenu();window.printAccommodationClassMatrix(id);};
