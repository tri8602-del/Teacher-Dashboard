function ensureAccommodations(){

}

function subPlanDutyWeekday(date){
  return (parseLocalDate(String(date)).getDay()||7);
}
function subPlanPeriodToken(label){
  const s=String(label||'').trim().toLowerCase().replace(/\s+/g,' ');
  if(!s)return '';
  const m=s.match(/^(\d+)(?:st|nd|rd|th)?(?:\s*period)?$/)||s.match(/^period\s*(\d+)(?:st|nd|rd|th)?$/);
  return m?('num:'+m[1]):('txt:'+s);
}
function subPlanDutiesFor(date,periodLabel){
  ensureSubPlans();
  const weekday=subPlanDutyWeekday(date),token=subPlanPeriodToken(periodLabel);
  if(!token)return [];
  return (data.subPlans.template.duties||[]).filter(d=>(d.days||[]).includes(weekday)&&subPlanPeriodToken(d.periodLabel)===token);
}
function subPlanPeriodPlans(date,weekday,period){
  if(!period)return [];
  const matching=lessonPlanRows().filter(r=>{
    if(!lessonRowAvailableOnDate(r,date,weekday))return false;
    const rp=Number(r.period)||0;
    if(rp===period)return true;
    if(r.type!=='custom')return (r.classIds||[]).some(id=>{
      const c=data.classes.find(x=>x.id===id);if(!c)return false;
      return (classPeriodLabel(c,weekday).match(/\d+/g)||[]).map(Number).includes(period);
    });
    return false;
  });
  const unique=[],seen=new Set();
  matching.forEach(r=>{if(!seen.has(r.id)){seen.add(r.id);unique.push(r);}});
  return unique.map(r=>({rowId:r.id,name:r.name,text:(lessonPlanEntry(r.id,date).text||'').trim()}));
}
function subPlanPeriodRows(date){
  ensureLessonPlans();ensureClassFields();ensureBellSchedules();ensureSubPlans();
  const schedule=bellScheduleById(getDateInfo(date).schedule||'regular');
  const weekday=subPlanDutyWeekday(date),out=[],used=new Set();
  (schedule?.periods||[]).forEach((p,i)=>{
    const period=classPeriodNumber(p[0]);
    const duties=subPlanDutiesFor(date,p[0]);
    duties.forEach(d=>used.add(d.id));
    const plans=subPlanPeriodPlans(date,weekday,period);
    out.push({key:period?`period_${period}_${i}`:`period_${i}_${p[0]}`,period:period||0,label:p[0],start:p[1],end:p[2],duty:duties[0]||null,duties,plans});
  });
  (data.subPlans.template.duties||[]).forEach(d=>{
    if(used.has(d.id)||!(d.days||[]).includes(weekday))return;
    const token=subPlanPeriodToken(d.periodLabel);
    const match=(schedule?.periods||[]).find(p=>token&&subPlanPeriodToken(p[0])===token);
    out.push({key:'duty_'+d.id,period:classPeriodNumber(d.periodLabel)||0,label:d.periodLabel||d.name||'Duty',start:match?match[1]:'',end:match?match[2]:'',duty:d,duties:[d],plans:[]});
  });
  return out;
}

function handleCloudSnapshot(record){
  if(!currentUser||!initializedUserData||!record)return;
  if(isStaleCloudRecord(record))return;
  if(sync.writing||isEditingNow()){if(!sync.deferred||Number(record.revision||0)>=Number(sync.deferred.revision||0)||String(record.updatedAt||"")>String(sync.deferred.updatedAt||""))sync.deferred=record;return;}
  sync.deferred=null;
  const changed=applyCloudRecord(record);
  if(changed){cloudStatus=sync.localDirty?"Saving to Firebase...":"Firebase synced";renderUnlessTypingLesson();}
  if(sync.localDirty)scheduleCloudSave(50);
}
function applyDeferredSnapshot(){if(sync.deferred&&!sync.writing&&!isEditingNow()){const r=sync.deferred;sync.deferred=null;handleCloudSnapshot(r);}}

function subscribeToCloud(){

}

async function syncCloud(){
  if(!currentUser||!initializedUserData)return;
  if(navigator.onLine===false){cloudStatus="Saved on this device — will sync when back online";renderUnlessTypingLesson();return;}
  sync.savePending=true;
  if(sync.writing)return;
  sync.writing=true;
  const slowNotice=setTimeout(()=>{if(sync.writing){cloudStatus="Saved on this device — still trying to reach Firebase";renderUnlessTypingLesson();}},10000);
  try{
    while(sync.savePending){
      sync.savePending=false;
      if(!sync.localDirty)break;
      cloudStatus="Saving to Firebase...";renderUnlessTypingLesson();
      const sent=cloudComparable(data),base=sync.baseData,expectRev=sync.baseRevision,expectUpd=sync.baseUpdatedAt,force=sync.forceReplace;
      let committed=null,newRev=0,newUpd="";
      await runTransaction(db,async tx=>{
        const ref=dashboardRef(),snap=await tx.get(ref);
        const rec=snap.exists()?snap.data():null,remote=rec?parseCloudDashboard(rec):null;
        const rRev=Number(rec?.revision||0),rUpd=String(rec?.updatedAt||"");
        let merged;
        if(!remote||force)merged=sent;                                       // first save, or an intentional replace (import / reset)
        else if(base&&rRev===expectRev&&rUpd===expectUpd)merged=sent;        // nobody else saved: safe to write
        else if(base)merged=mergeThreeWay(base,sent,remote);                 // another device saved: merge, don't overwrite
        else merged=mergeThreeWay(undefined,remote,sent);                    // no baseline yet: keep both sides' records
        newRev=Math.max(rRev,expectRev)+1;newUpd=new Date().toISOString();
        tx.set(ref,{dataJson:JSON.stringify(merged),ownerUid:currentUser.uid,updatedAt:newUpd,appVersion:APP_VERSION,revision:newRev});
        committed=merged;
      });
      const nowLocal=cloudComparable(data);
      if(sameData(nowLocal,sent)){
        if(!sameData(committed,sent)){data={...normalizeLoadedDashboard(committed),profileAvatar:data.profileAvatar||""};ensureBellSchedules();ensureClassFields();}
        sync.localDirty=false;
      }else{
        // The teacher kept editing while this save was in flight: keep those edits too.
        data={...normalizeLoadedDashboard(mergeThreeWay(sent,nowLocal,committed)),profileAvatar:data.profileAvatar||""};ensureBellSchedules();ensureClassFields();
        sync.localDirty=true;sync.savePending=true;
      }
      sync.baseData=cloneData(committed);sync.baseRevision=newRev;sync.baseUpdatedAt=newUpd;sync.forceReplace=false;
      if(sync.deferred&&isStaleCloudRecord(sync.deferred))sync.deferred=null;   // already merged into this save
      lastSyncAt=newUpd;saveLocal();saveSyncState(true);
      cloudStatus=sync.localDirty?"Saving to Firebase...":"Firebase synced";
    }
  }catch(err){
    console.error("Firebase save failed:",err);
    sync.localDirty=true;saveSyncState();
    cloudStatus="Saved on this device — will sync when back online";
  }finally{
    clearTimeout(slowNotice);sync.writing=false;
    renderUnlessTypingLesson();
    if(sync.savePending&&sync.localDirty)scheduleCloudSave(50);else applyDeferredSnapshot();
  }
}

function classEnrollmentPeriods(cls,studentId){
  cls.enrollmentPeriods=Array.isArray(cls.enrollmentPeriods)?cls.enrollmentPeriods:[];
  let periods=cls.enrollmentPeriods.filter(p=>p.studentId===studentId);
  if(!periods.length){
    periods=[{id:`ep_${cls.id}_${studentId}`,studentId,start:schoolStartDate()||"",end:schoolEndDate()||""}];
    cls.enrollmentPeriods.push(...periods);
  }
  return periods;
}
function pvaasDaysForPeriod(start,end){
  if(!start||!end)return 0; let n=0;
  for(let d=parseLocalDate(start);d<=parseLocalDate(end);d.setDate(d.getDate()+1)){
    const iso=localDateKey(d);
    if(isInstructionalOrInServiceDay(iso)&&!isPreStudentInService(iso))n++;
  } return n;
}
function pvaasTotalDays(){
  const start=schoolStartDate();
  const configured=data.pvaasSettings?.customEndDate||"";
  const end=configured||schoolEndDate();
  return start&&end?pvaasDaysForPeriod(start,end):178;
}

  if(!Array.isArray(data.pvaasCohorts)||!data.pvaasCohorts.length)data.pvaasCohorts=[{id:"all",name:"All PVAAS Students"}];
  if(!data.pvaasCohorts.some(c=>c.id==="all"))data.pvaasCohorts.unshift({id:"all",name:"All PVAAS Students"});

function mergeEnrollmentPeriods(periods){
  const sorted=periods.filter(p=>p.start&&p.end).map(p=>({start:p.start,end:p.end})).sort((a,b)=>a.start.localeCompare(b.start));
  const merged=[];
  for(const p of sorted){
    const last=merged[merged.length-1];
    if(!last){merged.push({...p});continue;}
    const nextDay=parseLocalDate(last.end);nextDay.setDate(nextDay.getDate()+1);
    const nextISO=localDateKey(nextDay);
    if(p.start<=nextISO&&p.end>last.end)last.end=p.end; else if(p.start>nextISO)merged.push({...p});
  }
  return merged;
}
function pvaasRows(){
  ensurePvaasData();ensureClassFields();
  const classes=data.classes.filter(c=>c.pvaasReported);
  const byStudent=new Map();
  classes.forEach(cls=>(cls.studentIds||[]).forEach(sid=>{
    const st=data.students.find(s=>s.id===sid);if(!st)return;
    if(!byStudent.has(sid))byStudent.set(sid,{student:st,classes:[]});
    byStudent.get(sid).classes.push(cls);
  }));
  return sortedStudents([...byStudent.values()].map(x=>x.student)).map(st=>{
    const entry=byStudent.get(st.id);
    const allPeriods=entry.classes.flatMap(cls=>classEnrollmentPeriods(cls,st.id));
    const merged=mergeEnrollmentPeriods(allPeriods);
    const days=merged.reduce((sum,p)=>sum+pvaasDaysForPeriod(p.start,p.end),0);
    return {...entry,merged,days};
  });
}

function classPeriodNumber(label){const m=String(label||"").match(/^(\d+)(?:st|nd|rd|th)?\s+Period\b/i);return m?Number(m[1]):null}
function timeToMinutes(value,previous=-1){
  const m=String(value||"").trim().match(/^(\d{1,2})(?::(\d{2}))?\s*(am|pm)?$/i);if(!m)return null;
  let h=Number(m[1]),min=Number(m[2]||0),ampm=(m[3]||"").toLowerCase();
  if(ampm){if(h===12)h=0;if(ampm==="pm")h+=12;}else{let raw=h*60+min;if(previous>=0&&raw+360<previous)raw+=720;return raw;}
  return h*60+min;
}
// Bell times are usually typed without AM/PM ("1:01"), so one time on its own is
// ambiguous. Reading the schedule in order keeps afternoon times after the morning
// ones (12:58 -> 1:01 -> 2:47 PM). Every place that needs a period's minutes uses this.
function orderedScheduleRows(schedule){
  const rows=[];let previous=-1;
  for(const row of (schedule?.periods||[])){
    const start=timeToMinutes(row[1],previous);if(start===null)continue;
    let end=timeToMinutes(row[2],start);if(end!==null&&end<start)end+=720;
    previous=end??start;
    rows.push({label:row[0],start,end,startText:row[1],endText:row[2]});
  }
  return rows;
}
function currentScheduleBlock(date=new Date()){
  const info=getDateInfo(todayISO());if(info.type!=="instructional")return null;

function classMeetsOnWeekday(cls,weekday){
  if(!cls)return false;
  const rules=Array.isArray(cls.rules)&&cls.rules.length?cls.rules:[];
  if(rules.length)return rules.some(r=>Array.isArray(r.days)&&r.days.map(Number).includes(Number(weekday)));

  const periods=[...new Set(rules.filter(r=>Array.isArray(r.days)&&r.days.map(Number).includes(Number(weekday))).flatMap(r=>Array.isArray(r.periods)?r.periods.map(Number):[]))];
  if(!periods.length&&Array.isArray(cls.periods))periods.push(...cls.periods.map(Number));

function lessonRowSortPeriod(row){
  // An explicitly assigned planning-row period always wins.
  const explicit=Number(row.period);
  if(Number.isFinite(explicit)&&explicit>0)return explicit;

  // Otherwise, use the earliest teaching period represented by the class/linked row.
  const periods=[];
  (row.classIds||[]).forEach(id=>{
    const cls=(data.classes||[]).find(c=>c.id===id);
    if(!cls)return;
    const rules=Array.isArray(cls.rules)&&cls.rules.length?cls.rules:[];
    rules.forEach(r=>(r.periods||[]).forEach(p=>{
      p=Number(p);if(Number.isFinite(p)&&p>0)periods.push(p);
    }));
    (cls.periods||[]).forEach(p=>{
      p=Number(p);if(Number.isFinite(p)&&p>0)periods.push(p);
    });
  });
  return periods.length?Math.min(...periods):999;
}
function lessonPlanRows(){
  ensureLessonPlans();ensureClassFields();
  const hidden=new Set(data.lessonPlanHiddenClassIds||[]), grouped=new Set();
  const groups=(data.lessonPlanSyncGroups||[]).map(g=>({id:g.id,name:String(g.name||'Linked Classes'),classIds:(g.classIds||[]).filter(id=>data.classes.some(c=>c.id===id)&&!hidden.has(id))})).filter(g=>g.classIds.length>1);
  groups.forEach(g=>g.classIds.forEach(id=>grouped.add(id)));
  (data.lessonPlanCustomRows||[]).forEach(r=>(r.classIds||[]).forEach(id=>grouped.add(id)));
  const syncRows=groups.map(g=>({id:'sync:'+g.id,type:'sync',name:g.name,classIds:g.classIds,days:[1,2,3,4,5],period:0}));
  const classRows=data.classes.filter(c=>!hidden.has(c.id)&&!grouped.has(c.id)).map(c=>({id:'class:'+c.id,type:'class',name:(c.nickname||c.name),fullName:c.name,classIds:[c.id],days:[1,2,3,4,5],period:0}));
  const custom=(data.lessonPlanCustomRows||[]).map(r=>({id:'row:'+r.id,type:'custom',name:r.name,classIds:Array.isArray(r.classIds)?r.classIds:[],days:r.days,period:r.period||0}));

  const base=[...syncRows,...classRows,...custom]
    .map((row,index)=>({...row,_sortPeriod:lessonRowSortPeriod(row),_sortIndex:index}))
    .sort((a,b)=>a._sortPeriod-b._sortPeriod || a._sortIndex-b._sortIndex || a.name.localeCompare(b.name));

  // Once Lindsay moves a row manually, that order takes priority.
  const saved=Array.isArray(data.lessonPlanRowOrder)?data.lessonPlanRowOrder:[];
  if(!saved.length)return base;

  const byId=new Map(base.map(r=>[r.id,r]));
  const ordered=saved.map(id=>byId.get(id)).filter(Boolean);
  const known=new Set(ordered.map(r=>r.id));
  base.forEach(r=>{if(!known.has(r.id))ordered.push(r);});

function lessonDateInRange(date,startDate,endDate){return !!date&&!!startDate&&!!endDate&&date>=startDate&&date<=endDate;}

function maybeAutoAdvanceLessonWeek(){
  const currentStart=isoDate(lessonWeekStart());
  const selected=window.lessonPlanWeekStart?isoDate(lessonWeekStart(window.lessonPlanWeekStart)):currentStart;

  // Only auto-advance the normal/current week. If the teacher deliberately
  // navigated to another week, don't fight that choice.
  if(selected!==currentStart)return;

  const now=new Date();
  const friday=new Date(lessonWeekStart());friday.setDate(friday.getDate()+4);friday.setHours(0,0,0,0);
  const fridayISO=isoDate(friday);
  const info=getDateInfo(fridayISO);
  if(info.type!=='instructional')return;

  const schedule=bellScheduleById(info.schedule||'regular');
  const ends=orderedScheduleRows(schedule).map(row=>row.end).filter(v=>v!==null);
  if(!ends.length)return;

  const lastEnd=Math.max(...ends);
  const day=now.getDay();
  const todayMinutes=now.getHours()*60+now.getMinutes();
  const shouldAdvance=day===6 || day===0 || (day===5 && todayMinutes>=lastEnd);
  if(shouldAdvance){
    const next=new Date(friday);
    next.setDate(next.getDate()+3);
    window.lessonPlanWeekStart=isoDate(next);
  }
}

function nextLessonMeetingDate(row,date){
  let d=isoAddDays(date,1);
  for(let i=0;i<240;i++){
    const weekday=parseLocalDate(d).getDay();
    if(weekday>=1&&weekday<=5){
      try{if(lessonRowAvailableOnDate(row,d,weekday))return d;}catch(e){}
    }
    d=isoAddDays(d,1);
  }
  return null;
}
function lessonEntryHasContent(e){
  if(!e)return false;
  return !!(String(e.text||'').trim()||e.planned||e.created||e.posted);
}
function shiftLessonRowForward(rowId,fromDate){
  const row=(lessonPlanRows()||[]).find(r=>r.id===rowId);
  if(!row)return {moved:0};
  ensureLessonPlans();
  data.lessonPlans.entries[rowId]=data.lessonPlans.entries[rowId]||{};
  const entries=data.lessonPlans.entries[rowId];
  const sourceDates=Object.keys(entries).filter(d=>d>=fromDate&&lessonEntryHasContent(entries[d])).sort();
  const snapshot=sourceDates.map(d=>({from:d,entry:{...entries[d]}}));
  const dest={};
  snapshot.forEach(item=>{dest[item.from]=nextLessonMeetingDate(row,item.from);});
  sourceDates.forEach(d=>delete entries[d]);
  let moved=0;
  snapshot.forEach(item=>{
    const to=dest[item.from];
    if(!to)return;
    entries[to]={text:item.entry.text||'',planned:!!item.entry.planned,created:!!item.entry.created,posted:!!item.entry.posted};
    moved++;
  });
  data.lessonPlanMultiDayLessons=(data.lessonPlanMultiDayLessons||[]).map(m=>{
    if(m.rowId!==rowId||m.startDate<fromDate)return m;
    const start=nextLessonMeetingDate(row,m.startDate),end=nextLessonMeetingDate(row,m.endDate);
    if(!start||!end)return m;
    moved++;
    return {...m,startDate:start,endDate:end};
  });
  return {moved};
}
window.pushLessonPlansForward=(rowId,fromDate)=>{
  const row=(lessonPlanRows()||[]).find(r=>r.id===rowId);
  if(!row)return;
  const next=nextLessonMeetingDate(row,fromDate);
  if(!next){alert('No later meeting day was found for this row.');return;}
  const fromLabel=parseLocalDate(fromDate).toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'});
  const nextLabel=parseLocalDate(next).toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'});
  if(!confirm(`Leave ${fromLabel} empty for ${row.name} and move this plan plus every later plan to the next meeting day?\n\n${fromLabel} → ${nextLabel}, and later days shift the same way.`))return;
  const result=shiftLessonRowForward(rowId,fromDate);
  save();
  toast=result.moved?`Pushed ${row.name} forward.`:'Nothing later to move.';
  render();
};
window.pushAllLessonPlansForward=(fromDate)=>{
  const fromLabel=parseLocalDate(fromDate).toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'});
  if(!confirm(`Skip ${fromLabel} on every planning row?\n\nEach row's plan from that day forward will move to that row's next meeting day.`))return;
  let moved=0;
  (lessonPlanRows()||[]).forEach(row=>{
    const weekday=parseLocalDate(fromDate).getDay();
    let available=false;
    try{available=lessonRowAvailableOnDate(row,fromDate,weekday);}catch(e){}
    if(!available)return;
    moved+=shiftLessonRowForward(row.id,fromDate).moved;
  });
  save();
  toast=moved?`Pushed lesson plans forward from ${fromLabel}.`:'Nothing later to move.';
  render();
};

function msObj(v){return v&&typeof v==="object"&&!Array.isArray(v)}

    const rev=Number(m.seedRev[MS_SEED_YEAR])||1;

function msApplySeedUpgrade(m,list){

// Beginning-of-Trimester / Semester markers, else an even split of the school days.
function msTermRange(yk,code){
  const m=String(code||"").match(/^([ts])(\d)$/);if(!m)return null;
  const n=Number(m[2]),tri=m[1]==="t",count=tri?3:2,b=msBounds(yk),w=msYearWindow(yk);
  const p=(((data.calendarSettings||{}).markingPeriods||{})[tri?"trimesters":"semesters"]||[])[n-1];
  if(p&&p.start&&p.end&&p.start>=w.from&&p.end<=w.to)return {start:p.start,end:p.end,source:"calendar"};
  const key=tri?"trimester":"semester";
  let starts=Object.keys(data.calendarOverrides||{}).filter(d=>d>=w.from&&d<=w.to&&(data.calendarOverrides[d]||{})[key]).sort();
  if(starts.length===count-1&&starts[0]>b.start)starts=[b.start,...starts];
  if(starts.length>=count){const start=starts[n-1],end=n<count?isoAddDays(starts[n],-1):b.end;return {start,end,source:"calendar"};}
  const days=msWeekdays(b.start,b.end),size=Math.ceil(days.length/count),part=days.slice((n-1)*size,n*size);
  return part.length?{start:part[0],end:part[part.length-1],source:"estimate"}:null;
}
function msSegments(yk,course){
  return ((course&&course.segments)||[]).map(s=>{const r=(s.start&&s.end)?{start:s.start,end:s.end,source:"saved"}:msTermRange(yk,s.code);return r?{...s,...r}:null}).filter(Boolean);
}
function msShortDate(d){return parseLocalDate(d).toLocaleDateString(undefined,{month:"short",day:"numeric"})}
function msLongDate(d){return parseLocalDate(d).toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric",year:"numeric"})}
function msWeekOf(d){const x=parseLocalDate(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return localDateKey(x)}
// The school year today belongs to: the Calendar's year when today falls between the
// summer before its first student day and its last student day, else by date (July 1).
function msTodayYear(){
  const t=todayISO(),s=data.calendarSettings||{};
  if(s.firstStudentDay&&s.lastStudentDay&&s.firstStudentDay<=s.lastStudentDay){const k=msYearKeyFor(s.firstStudentDay);if(t>=msYearWindow(k).from&&t<=s.lastStudentDay)return k;}
  return msYearKeyFor(t);
}
function msPrevYearKey(yk){const s=Number(String(yk).slice(0,4))-1;return `${s}-${String((s+1)%100).padStart(2,"0")}`}
// The page opens on the current school year each time; the picker choice lasts for this visit only.
function msCurrentYear(){
  const keys=msYearKeys();
  if(!keys.includes(msView.year)){const t=msTodayYear();msView.year=keys.includes(t)?t:keys.includes(MS_SEED_YEAR)?MS_SEED_YEAR:(keys[keys.length-1]||"");}
  return msView.year;
}
// First visit in a school year with no Master Schedule yet: build it from last year with
// the usual roll-forward defaults. Runs once (remembered in the synced data), never
// touches an existing year, and waits for the Calendar: the dashboard must have finished
// loading from the cloud and the Calendar must have this year's first and last student days.
function msAutoBuildCurrentYear(){
  if(!initializedUserData)return false;
  const m=msStore(),yk=msTodayYear(),from=msPrevYearKey(yk);
  if(m.autoBuilt[yk]||m.years[yk]||!m.years[from])return false;
  if(msBounds(yk).source!=="calendar")return false;
  msRollChoices=null;
  msDoRoll(from,yk,false);
  m.years[yk].rolledFrom={year:from,auto:true};
  m.autoBuilt[yk]=true;msView.year=yk;msView.month="";
  return true;
}
function msWaitingForCalendar(){
  const m=msStore(),yk=msTodayYear();
  return !m.years[yk]&&!(m.autoBuilt||{})[yk]&&!!m.years[msPrevYearKey(yk)]&&msBounds(yk).source!=="calendar";
}
function msCurrentCourse(yk){
  const y=msYear(yk);if(!y||!y.courses.length)return null;

function msLegendHTML(){return MS_TYPES.map(([k,l,c])=>`<span class="msChip${k==="noclass"?" msT-noclass":""}" style="--ms-bg:${c}">${esc(l)}</span>`).join("")}

// The grid. print=true gives plain boxes for the print window.
function msGridHTML(yk,course,print=false){
  const y=msYear(yk)||{},months=msMonths(yk),b=msBounds(yk),all=msWeekdays(b.start,b.end),segs=msSegments(yk,course);
  // A week or more of No School with nothing written in it is drawn as one block
  // (like the "Winter break" box on the paper sheets).
  const breakRun={};let run=[];
  const flush=()=>{if(run.length>=5)run.forEach(d=>breakRun[d]=run[0]);run=[];};
  all.forEach(d=>{const c=(course?.cells||{})[d]||{};if(msDayType(yk,course,d).type==="noschool"&&!c.text&&!c.unsure)run.push(d);else flush();});flush();
  if(!msView.month||!months.includes(msView.month)){const t=todayISO().slice(0,7);msView.month=months.includes(t)?t:months[0];}
  const tag=print?"div":"button",today=todayISO(),markPast=yk===msTodayYear(),sel=!print&&msView.select;
  const cols=months.map(mk=>{
    const dates=all.filter(d=>d.startsWith(mk)),[yy,mm]=mk.split("-").map(Number);
    const monthSegs=segs.filter(s=>s.start.slice(0,7)<=mk&&s.end.slice(0,7)>=mk).map(s=>s.name);
    let rows="",prev="";
    for(let i=0;i<dates.length;i++){
      const d=dates[i],week=prev&&msWeekOf(prev)!==msWeekOf(d)?" msWeek":"";
      if(breakRun[d]){
        let j=i;while(j+1<dates.length&&breakRun[dates[j+1]]===breakRun[d])j++;
        const first=dates[i],last=dates[j],label=y.dayLabels?.[breakRun[d]]||y.dayLabels?.[first]||(calendarNotesFor(first)[0])||"No School";
        const span=first===last?`${parseLocalDate(first).getDate()}`:`${parseLocalDate(first).getDate()}–${parseLocalDate(last).getDate()}`;
        rows+=`<${tag} ${print?"":sel?`type="button" disabled`:`type="button" onclick="window.msEditCell('${first}')"`} class="msCell msBreak${week}" style="--ms-bg:${MS_TYPE.noschool.color}" title="${esc(label)} (${esc(msShortDate(first))} – ${esc(msShortDate(last))})"><b>${span}</b><span class="msText">${esc(label)}</span></${tag}>`;
        prev=last;i=j;continue;
      }
      const c=(course?.cells||{})[d]||{},t0=msDayType(yk,course,d),off=segs.length&&!segs.some(s=>d>=s.start&&d<=s.end);
      // Days outside this course's semester/trimester show as "No class" unless the day has its own color.
      const t=off&&!t0.type?{type:"noclass",source:"term"}:t0;
      const when=print?"":d===today?" msToday":(markPast&&d<today?" msPast":"");
      const tip=[msLongDate(d)+(d===today?" (today)":""),c.text||"",t.type?MS_TYPE[t.type]?.label+(t.source==="calendar"?" (from your Calendar)":t.source==="course"?" (this course only)":t.source==="term"?" (outside this course's term)":""):"",c.unsure?"Unsure: "+c.unsure:"",off?"Not in session for this course":""].filter(Boolean).join(" · ");
      rows+=`<${tag} ${print?"":sel?`type="button" onclick="window.msCellTap(event,'${d}')"`:`type="button" onclick="window.msEditCell('${d}')"`} data-ms-date="${d}" class="msCell${week}${when}${sel&&msSel.has(d)?" msSel":""}${t.type?" msT-"+t.type:""}${off?" msOff":""}${c.unsure?" msUnsure":""}" style="${t.type&&MS_TYPE[t.type]?`--ms-bg:${MS_TYPE[t.type].color}`:""}" title="${esc(tip)}"><b>${parseLocalDate(d).getDate()}</b><span class="msText">${esc(c.text||"")}</span>${c.unsure&&!print?`<i class="msUnsureMark"></i>`:""}</${tag}>`;
      prev=d;
    }
    return `<div class="msCol${mk===msView.month?" msActive":""}" data-ms-month="${mk}"><div class="msMonth"${sel?` role="button" tabindex="0" title="Select every school day in ${esc(MS_MONTHS[mm-1])}" onclick="window.msPickMonth('${mk}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();window.msPickMonth('${mk}')}"`:""}>${MS_MONTHS[mm-1]}${monthSegs.length?`<span class="msMonthSeg">${esc(monthSegs.join(" / "))}</span>`:""}</div>${rows||`<div class="msEmptyMonth">No school days</div>`}</div>`;
  }).join("");
  // Term names under the months (like CROCHET / ENGINEERING / MATH PUZZLES on the sheet).
  // A month shared by two terms goes to the term with more of its days.
  const owner=months.map(mk=>{let best=-1,n=0;segs.forEach((s,i)=>{const c=all.filter(d=>d.startsWith(mk)&&d>=s.start&&d<=s.end).length;if(c>n){n=c;best=i;}});return best;});
  const band=segs.length?`<div class="msSegBand" style="--ms-cols:${months.length}">${segs.map((s,i)=>{let a=owner.indexOf(i),z=owner.lastIndexOf(i);if(a<0){a=Math.max(0,months.indexOf(s.start.slice(0,7)));z=a;}return `<span style="grid-column:${a+1}/${z+2};grid-row:1">${esc(s.name)}</span>`}).join("")}</div>`:"";
  // Months with only a few school days (the late-August start, early June) get a narrower column.
  const tpl=print?"":`--ms-tpl:${months.map(mk=>all.filter(d=>d.startsWith(mk)).length<=6?"minmax(calc(var(--ms-min) * .62),.6fr)":"minmax(var(--ms-min),1fr)").join(" ")};`;
  return `<div class="msGridWrap${sel?" msSelecting":""}" style="${tpl}"><div class="msGrid" style="--ms-cols:${months.length}">${cols}</div>${band}</div>`;
}

// --- Roll forward ---------------------------------------------------------------
// Copies each course's lessons, in order, onto the next year's school days.
// Day types are never copied: the new year gets them from its own Calendar.
function msSourceChoices(fromYk){
  const out=[];(msYear(fromYk)?.courses||[]).forEach(c=>{
    if(c.segments?.length)c.segments.forEach(s=>out.push({value:`${c.id}:${s.name}`,label:`${c.name} — ${s.name}`}));
    else out.push({value:c.id,label:c.name});
  });return out;
}
function msSourceSequence(fromYk,src){
  if(!src)return [];
  const [cid,segName]=String(src).split(/:(.+)/);const course=(msYear(fromYk)?.courses||[]).find(c=>c.id===cid);if(!course)return [];
  let {start,end}=msBounds(fromYk);
  if(segName){const s=msSegments(fromYk,course).find(s=>s.name===segName);if(!s)return [];start=s.start;end=s.end;}
  const seq=[];
  msWeekdays(start,end).forEach(d=>{
    const t=msDayType(fromYk,course,d).type,c=course.cells[d]||{},text=String(c.text||"").trim();
    if(MS_NO_CLASS.test(text))return;                       // ~~~, —, ✕ = no class that day
    if(!text&&(t==="noschool"||t==="inservice"))return;     // no students
    seq.push({text,unsure:c.unsure||"",from:d});
  });
  while(seq.length&&!seq[seq.length-1].text)seq.pop();
  return seq;
}
function msRollTargets(fromYk,toYk){
  const ty=msYear(toYk);
  if(ty&&ty.courses.length)return ty.courses.map(c=>({id:c.id,name:c.name,from:c.from||"",segments:c.segments?structuredClone(c.segments):null}));
  if(toYk==="2026-27")return structuredClone(MS_PLAN_2026_27).map(c=>({...c,segments:c.segments||null}));

function msRollPlan(fromYk,toYk){

    });

// Copy the plan into the target year. Existing text is only replaced when replace=true.
function msDoRoll(fromYk,toYk,replace){
  const units=msRollPlan(fromYk,toYk),m=msStore();
  if(!m.years[toYk])m.years[toYk]={dayTypes:{},dayLabels:{},courses:[]};
  const y=m.years[toYk];let placed=0,kept=0;
  units.forEach(u=>{
    let c=y.courses.find(x=>x.id===u.target.id);
    if(!c){c={id:u.target.id,name:u.target.name,from:u.target.from||"",cells:{}};if(u.target.segments)c.segments=u.target.segments.map(s=>({name:s.name,...(s.code?{code:s.code}:{}),...(s.start&&s.end?{start:s.start,end:s.end}:{}),from:s.from||""}));y.courses.push(c);}
    if(u.seg){const s=(c.segments||[]).find(s=>s.name===u.seg.name);if(s)s.from=u.src;}else c.from=u.src;
    u.placed.forEach(p=>{
      const old=c.cells[p.date];
      if(old&&old.text&&!replace){if(old.text!==p.text)kept++;return;}
      if(!p.text&&!(old&&old.text))return;
      const cell={...(old||{})};if(p.text)cell.text=p.text;else delete cell.text;
      if(p.unsure)cell.unsure=`Carried over from ${fromYk} (${msShortDate(p.from)}): ${p.unsure}`;else if(old&&old.unsure&&replace)delete cell.unsure;
      if(Object.keys(cell).length)c.cells[p.date]=cell;else delete c.cells[p.date];
      placed++;
    });
  });
  msStore();
  return {placed,kept};
}

// Apply one change to many days of one course as a single save, and remember it for Undo.
function msApplyBulk(yk,course,dates,action,opts={}){
  const y=msYear(yk);if(!y||!course)return {changed:0,kept:[]};
  const kept=opts.keep||[],keepSet=new Set(kept),before={},after={},sBefore={},sAfter={};
  dates.filter(d=>!keepSet.has(d)).forEach(d=>{
    if(opts.scope==="school"&&(action==="settype"||action==="cleartype")){
      const old=y.dayTypes[d]||"";const now=action==="settype"?opts.value:"";
      if(old===now)return;sBefore[d]=old;sAfter[d]=now;if(now)y.dayTypes[d]=now;else delete y.dayTypes[d];return;
    }
    const old=course.cells[d]?{...course.cells[d]}:null,cell={...(old||{})};
    if(action==="cleartext"){delete cell.text;delete cell.unsure;}
    else if(action==="settext"){cell.text=opts.value;}
    else if(action==="settype"){cell.type=opts.value;if(opts.clearText){delete cell.text;delete cell.unsure;}}
    else if(action==="cleartype"){delete cell.type;}
    else if(action==="flag"){cell.unsure=cell.unsure||"Flagged to double-check.";}
    else if(action==="unflag"){delete cell.unsure;}
    const now=Object.keys(cell).length?cell:null;
    if(sameData(old,now))return;
    before[d]=old;after[d]=now;if(now)course.cells[d]=now;else delete course.cells[d];
  });
  const changed=Object.keys(before).length+Object.keys(sBefore).length;
  if(changed){msUndo={yk,courseId:course.id,courseName:course.name,label:opts.label||"Bulk change",count:changed,before,after,sBefore,sAfter};save();}
  return {changed,kept};
}

window.msUndoBulk=()=>{
  const u=msUndo;if(!u)return;
  const y=msYear(u.yk),course=(y?.courses||[]).find(c=>c.id===u.courseId);if(!y||!course){msUndo=null;render();return;}
  let restored=0,skipped=0;
  Object.keys(u.before).forEach(d=>{const cur=course.cells[d]||null;if(!sameData(cur,u.after[d])){skipped++;return;}if(u.before[d])course.cells[d]=structuredClone(u.before[d]);else delete course.cells[d];restored++;});
  Object.keys(u.sBefore).forEach(d=>{const cur=y.dayTypes[d]||"";if(cur!==u.sAfter[d]){skipped++;return;}if(u.sBefore[d])y.dayTypes[d]=u.sBefore[d];else delete y.dayTypes[d];restored++;});
  msUndo=null;
  toast=`Undone: ${u.label} — ${restored} day${restored===1?"":"s"} put back${skipped?` (${skipped} you've changed since were left as they are)`:""}.`;
  if(restored)save();render();
};

function gcRequestAccess(afterClassModalId=""){
  const clientId=googleClassroomClientId();

        if(response?.error){gcSetStatus(response.error_description||response.error||"Google authorization was not completed.");return;}
        state.accessToken=response.access_token||"";
        state.expiresAt=Date.now()+Math.max(0,Number(response.expires_in||3600)-60)*1000;
        data.googleClassroom??={};data.googleClassroom.connectedAt=new Date().toISOString();save();

}

async function gcApi(path,params={}){
  const state=window.googleClassroomState;
  if(!state.accessToken||Date.now()>=state.expiresAt)throw new Error("Your Google Classroom connection has expired. Click Connect Google Classroom again.");
  const url=new URL(`https://classroom.googleapis.com/v1/${path}`);
  Object.entries(params).forEach(([k,v])=>{if(v!==undefined&&v!==null&&v!=="")url.searchParams.set(k,v)});
  const res=await fetch(url.toString(),{headers:{Authorization:`Bearer ${state.accessToken}`}});
  const payload=await res.json().catch(()=>({}));
  if(!res.ok){
    const detail=payload?.error?.message||`Google Classroom request failed (${res.status}).`;
    if(res.status===401)state.expiresAt=0;
    throw new Error(detail);
  }
  return payload;
}

async function gcListPages(path,params,key){
  const out=[];let pageToken="";
  do{
    const payload=await gcApi(path,{...params,pageSize:100,...(pageToken?{pageToken}:{})});
    if(Array.isArray(payload?.[key]))out.push(...payload[key]);
    pageToken=payload?.nextPageToken||"";
  }while(pageToken);
  return out;
}

  state.gradeCatalogs[courseId]=catalog;return catalog;

function gcCategoryPercent(submissions,assignments,categoryId,studentUserId){
  const items=assignments.filter(a=>a.categoryId===categoryId);
  let earned=0,total=0;
  items.forEach(a=>{const sub=submissions.find(x=>String(x.courseWorkId)===a.id&&String(x.userId)===String(studentUserId));const grade=Number(sub?.assignedGrade);if(Number.isFinite(grade)&&Number.isFinite(a.maxPoints)&&a.maxPoints>0){earned+=grade;total+=a.maxPoints;}});
  return total>0?earned/total*100:"";
}
function gcAssignmentPercent(submissions,assignments,assignmentId,studentUserId){
  const a=assignments.find(x=>x.id===assignmentId);if(!a||!a.maxPoints)return "";
  const sub=submissions.find(x=>String(x.courseWorkId)===a.id&&String(x.userId)===String(studentUserId));const grade=Number(sub?.assignedGrade);return Number.isFinite(grade)?grade/a.maxPoints*100:"";
}
function gcCalculateSourceValue(src,catalog,submissions,studentUserId){
  if(!src||src.type==="none")return "";
  if(src.type==="category")return gcCategoryPercent(submissions,catalog.assignments,src.categoryId,studentUserId);
  if(src.type==="assignment")return gcAssignmentPercent(submissions,catalog.assignments,src.assignmentId,studentUserId);
  if(src.type==="combination"){
    const items=(src.categoryItems||[]).filter(x=>x.id&&Number(x.weight)>0);if(!items.length)return "";
    const entered=items.map(x=>({v:gcCategoryPercent(submissions,catalog.assignments,x.id,studentUserId),w:Number(x.weight)})).filter(x=>x.v!==""&&Number.isFinite(x.v));
    if(!entered.length)return "";const tw=entered.reduce((s,x)=>s+x.w,0);return tw>0?entered.reduce((s,x)=>s+x.v*x.w,0)/tw:"";
  }
  return "";
}
async function gcFetchGradesForClass(c){

    c.grades[st.id]??={};c.classroomGradeOverrides[st.id]??={};c.classroomGradePulled[st.id]??={};

}

function splitClassroomName(profile){
  const given=String(profile?.name?.givenName||"").trim();
  const family=String(profile?.name?.familyName||"").trim();
  const full=String(profile?.name?.fullName||"").trim();
  if(given||family)return {firstName:given,lastName:family,name:[given,family].filter(Boolean).join(" ")};
  const parts=full.split(/\s+/).filter(Boolean);
  if(parts.length>1)return {firstName:parts.shift(),lastName:parts.join(" "),name:full};
  return {firstName:full,lastName:"",name:full||"Unnamed Student"};
}

function gcNameKey(info){return [String(info?.firstName||""),String(info?.lastName||"")].join(" ").trim().toLowerCase().replace(/[^a-z0-9]+/g," ").trim();}
function gcStudentCandidates(info){
  const key=gcNameKey(info);if(!key)return [];
  return data.students.filter(s=>gcNameKey({firstName:studentFirstName(s),lastName:studentLastName(s)})===key);
}
function gcBuildImportPlan(){
  const state=window.googleClassroomState;const ids=[...(state.selected||[])];
  const plan={students:[],matches:[],newStudents:0};const seenUsers=new Set();
  ids.forEach(courseId=>{
    const roster=state.rosters?.[courseId]||[];
    roster.forEach(student=>{
      const userId=String(student?.userId||"").trim();if(!userId||seenUsers.has(userId))return;seenUsers.add(userId);
      const info=splitClassroomName(student.profile||{});
      const local=data.students.find(s=>s.googleClassroomUserId===userId);
      if(local){plan.students.push({userId,info,localId:local.id,source:student});return;}
      const candidates=gcStudentCandidates(info);
      if(candidates.length===1){plan.students.push({userId,info,localId:candidates[0].id,source:student,matchedByName:true});return;}
      if(candidates.length>1){plan.matches.push({userId,info,candidates:candidates.map(s=>({id:s.id,name:studentDisplayName(s)})),source:student,localId:"",createNew:false});return;}
      plan.students.push({userId,info,localId:"",source:student});plan.newStudents++;
    });
  });
  return plan;
}
window.gcPrepareImport=()=>{
  const state=window.googleClassroomState;const ids=[...(state.selected||[])];
  if(!ids.length){alert("Choose at least one Google Classroom class first.");return;}
  const missing=ids.filter(id=>!Array.isArray(state.rosters?.[id]));
  if(missing.length){alert("Load the selected rosters first so you can review the students before importing them.");return;}
  state.importPlan=gcBuildImportPlan();

  renderSetupWizard();
};
window.gcResolveMatch=(index,localId)=>{

  if(localId==="__new__"){m.localId="";m.createNew=true;}else{m.localId=localId;m.createNew=false;}
  renderSetupWizard();

function gcUpsertStudent(student,forcedLocalId=""){
  const userId=String(student?.userId||"").trim();if(!userId)return null;
  const info=splitClassroomName(student.profile||{});
  let local=forcedLocalId?data.students.find(s=>s.id===forcedLocalId):data.students.find(s=>s.googleClassroomUserId===userId);
  if(!local){local={id:uid(),googleClassroomUserId:userId,googleClassroomImported:true,...info};data.students.push(local);}
  else{local.googleClassroomUserId=userId;local.firstName=info.firstName;local.lastName=info.lastName;local.name=info.name;local.googleClassroomImported=true;}
  return local.id;
}

    else{local.name=String(course.name||local.name||"Google Classroom Class").trim();if(course.section)local.nickname=String(course.section).trim();local.studentIds=studentIds;local.googleClassroomImported=true;local.googleClassroomCourseId=courseId;}

function normalizeStudents(){
  data.students??=[];
  data.students.forEach(s=>{
    // Repair the accidental V1.6.16 migration that duplicated first names.
    let first=(s.firstName||"").trim();
    let last=(s.lastName||"").trim();
    const current=(s.name||"").trim();

    if(!first && !last){
      const split=splitStudentName(current);
      first=split.firstName; last=split.lastName;
    }else{
      if(!first) first=splitStudentName(current).firstName;
      if(!last) last=splitStudentName(current).lastName;

      // Example bad V1.6.16 data: firstName="Abrianna", lastName="Abrianna DeBolt"
      if(first && last && last.toLowerCase().startsWith(first.toLowerCase()+" ")){
        last=last.slice(first.length).trim();
      }
      // Example bad display name: "Abrianna Abrianna DeBolt"
      const doubledPrefix=(first+" "+first+" ").toLowerCase();
      if(first && current.toLowerCase().startsWith(doubledPrefix) && !last){
        last=current.slice((first+" "+first+" ").length).trim();
      }
    }

    s.firstName=first;
    s.lastName=last;
    s.name=[first,last].filter(Boolean).join(" ") || current || "Unnamed Student";
  });
}
function sortedStudents(list=data.students){
  normalizeStudents();
  return [...list].sort((a,b)=>{
    const la=studentLastName(a).localeCompare(studentLastName(b),undefined,{sensitivity:"base"});
    if(la)return la;
    return studentFirstName(a).localeCompare(studentFirstName(b),undefined,{sensitivity:"base"});
  });
}

  const accom=(data.accommodations||[]).filter(a=>a.studentId===st.id).length;
  const forms=(data.forms||[]).filter(f=>(f.targetStudentIds||[]).includes(st.id)||Object.prototype.hasOwnProperty.call(f.records||{},st.id)).length;
  return `${classes} class${classes===1?"":"es"} · ${events} event${events===1?"":"s"} · ${notes} note${notes===1?"":"s"} · ${accom} accommodation${accom===1?"":"s"} · ${forms} form record${forms===1?"":"s"}`;
}
function mergeStudentData(target,source){
  const targetId=target.id,sourceId=source.id;
  data.classes.forEach(c=>{
    const ids=c.studentIds||[];
    if(ids.includes(sourceId))ids.push(targetId);
    c.studentIds=[...new Set(ids.filter(id=>id!==sourceId))];
    if(Array.isArray(c.enrollmentPeriods))c.enrollmentPeriods.forEach(x=>{if(x.studentId===sourceId)x.studentId=targetId;});
    if(Array.isArray(c.rosterHistory))c.rosterHistory.forEach(x=>{if(x.studentId===sourceId)x.studentId=targetId;});
  });
  data.events.forEach(e=>{if(e.studentId===sourceId)e.studentId=targetId;});
  data.notes.forEach(n=>{if(n.studentId===sourceId)n.studentId=targetId;});
  (data.accommodations||[]).forEach(a=>{if(a.studentId===sourceId)a.studentId=targetId;});
  (data.accommodationSources||[]).forEach(a=>{if(a.studentId===sourceId)a.studentId=targetId;});
  (data.groups||[]).forEach(g=>{
    if(Array.isArray(g.studentIds)&&g.studentIds.includes(sourceId))g.studentIds=[...new Set([...g.studentIds.filter(id=>id!==sourceId),targetId])];
  });
  (data.forms||[]).forEach(f=>{
    if(Array.isArray(f.targetStudentIds)&&f.targetStudentIds.includes(sourceId))f.targetStudentIds=[...new Set([...f.targetStudentIds.filter(id=>id!==sourceId),targetId])];
    f.records=f.records&&typeof f.records==='object'?f.records:{};
    if(Object.prototype.hasOwnProperty.call(f.records,sourceId)){
      const src=f.records[sourceId]&&typeof f.records[sourceId]==='object'?f.records[sourceId]:{};
      const dst=f.records[targetId]&&typeof f.records[targetId]==='object'?f.records[targetId]:{};
      f.records[targetId]={...src,...dst};
      delete f.records[sourceId];
    }
  });
  (data.gradeCourses||[]).forEach(c=>{
    c.grades=c.grades&&typeof c.grades==='object'?c.grades:{};
    if(Object.prototype.hasOwnProperty.call(c.grades,sourceId)){
      const src=c.grades[sourceId]&&typeof c.grades[sourceId]==='object'?c.grades[sourceId]:{};
      const dst=c.grades[targetId]&&typeof c.grades[targetId]==='object'?c.grades[targetId]:{};
      c.grades[targetId]={...src,...dst};
      delete c.grades[sourceId];
    }
  });
  ensurePvaasData();
  const targetCohort=data.pvaasStudentCohorts[targetId],sourceCohort=data.pvaasStudentCohorts[sourceId];
  if(!targetCohort&&sourceCohort)data.pvaasStudentCohorts[targetId]=sourceCohort;
  delete data.pvaasStudentCohorts[sourceId];
  if(data.classroomTools?.randomStudentId===sourceId)data.classroomTools.randomStudentId=targetId;
  (data.classroomTools?.groups||[]).forEach(group=>{
    if(Array.isArray(group)&&group.includes(sourceId)){
      const i=group.indexOf(sourceId);group.splice(i,1);if(!group.includes(targetId))group.push(targetId);
    }
  });
  target.doNotSeatWith=[...new Set([...(target.doNotSeatWith||[]),...(source.doNotSeatWith||[])])].filter(id=>id!==targetId&&id!==sourceId);
  data.students.forEach(st=>{
    if(st.id===targetId)return;
    if(Array.isArray(st.doNotSeatWith)&&st.doNotSeatWith.includes(sourceId)){
      st.doNotSeatWith=[...new Set([...st.doNotSeatWith.filter(id=>id!==sourceId),targetId])];
    }
  });
  // Keep the dashboard's existing name/display preference. Transfer the Classroom identity
  // only when the kept record does not already have one. If both records have different
  // Classroom identities, the caller blocks the merge because they may be different people.
  if(!target.googleClassroomUserId&&source.googleClassroomUserId)target.googleClassroomUserId=source.googleClassroomUserId;
  if(source.googleClassroomImported)target.googleClassroomImported=true;
  data.students=data.students.filter(s=>s.id!==sourceId);
}

function accommodationSourceApprovalText(d){
  const total=Math.max(Number(d.candidateTotal||d.candidateCount||0),0);
  const approved=Math.max(Number(d.approvedCount||((d.extractionStatus==="approved")?d.candidateCount:0)),0);
  if(d.extractionStatus==="approved"||approved>0)return `${approved}/${total||approved} approved`;
  if(d.extractionStatus==="ready")return `${total} candidate${total===1?"":"s"} ready for review`;
  if(d.extractionStatus==="processing")return "AI extraction in progress";
  if(d.extractionStatus==="error")return "AI extraction failed";

function accommodationMatrixLabel(a){
  const manual=String(a.matrixLabel||"").trim();
  if(manual)return manual;
  const detail=String(a.details||"").trim();
  if(detail)return detail;
  const text=String(a.text||"").trim();
  const ratio=(text+" "+String(a.sourceQuote||"")).match(/\b\d+(?:\.\d+)?x\b/i);
  if(ratio)return ratio[0];
  const context=text+" "+String(a.sourceQuote||"");
  if(/visual[\s\/-]+(?:and|&)\s*auditory|auditory[\s\/-]+(?:and|&)\s*visual/i.test(context))return "Visual/auditory distractions";
  if(/written directions/i.test(text)&&/(repeat|clarif)/i.test(text))return "Written directions + repeat/clarify";
  if(/check(?:ing)?\s+(?:for\s+)?understanding/i.test(text))return "Check understanding";
  if(/calculator/i.test(text))return /when permitted|when allowed|as permitted/i.test(text) ? "Calculator when permitted" : "Calculator";
  if(/extended time/i.test(text))return "Extended time";
  if(/reduced visual|reduced auditory|distraction/i.test(text))return "Reduced distractions";
  if(text.length<=34)return text;
  return text.slice(0,31).trimEnd()+"…";
}

function isWeekday(date){const d=parseLocalDate(date).getDay();return d!==0&&d!==6}
function baseDateType(date){
  const s=data.calendarSettings||{};
  const within=!!(s.firstStudentDay&&s.lastStudentDay&&date>=s.firstStudentDay&&date<=s.lastStudentDay);
  return within&&isWeekday(date)?"instructional":"outside";
}

// Shared school-year helpers. These read directly from calendar settings and
// overrides so the Calendar and PVAAS pages use the same counting rules.
function schoolStartDate(){return (data.calendarSettings||{}).firstStudentDay||""}
function schoolEndDate(){return (data.calendarSettings||{}).lastStudentDay||""}
function isInstructionalOrInServiceDay(date){
  const o=(data.calendarOverrides||{})[date]||{};
  const type=o.type||baseDateType(date);
  return isWeekday(date)&&(type==="instructional"||type==="inservice"||type==="earlydismissal");
}
function isPreStudentInService(date){
  const start=schoolStartDate();
  return !!(start&&date<start);
}

function getDateInfo(date){
  const o=(data.calendarOverrides||{})[date]||{};
  const type=o.type||baseDateType(date);
  const s=data.calendarSettings||{};
  const within=!!(s.firstStudentDay&&s.lastStudentDay&&date>=s.firstStudentDay&&date<=s.lastStudentDay);
  const counted=within&&isWeekday(date)&&(type==="instructional"||type==="inservice"||type==="earlydismissal");
  const markers={
    nineWeeks:!!o.nineWeeks,endNineWeeks:!!o.endNineWeeks,
    trimester:!!o.trimester,endTrimester:!!o.endTrimester,
    semester:!!o.semester,endSemester:!!o.endSemester
  };
  let schedule=o.schedule!==undefined?o.schedule:((type==="instructional"||type==="earlydismissal")?"regular":"");
  if(schedule==="alternate")schedule="regular";
  ensureBellSchedules();
  if(schedule&&!data.bellSchedules.some(s=>s.id===schedule))schedule="regular";
  return {type,counted,markers,schedule,countedDay:counted?countedDaysBefore(date):0};
}
function countedDaysBefore(date){
  const s=data.calendarSettings||{};
  if(!s.firstStudentDay||!s.lastStudentDay||date<s.firstStudentDay)return 0;
  const end=date>s.lastStudentDay?s.lastStudentDay:date;
  let count=0,d=s.firstStudentDay;
  while(d<=end){
    const o=(data.calendarOverrides||{})[d]||{};
    const type=o.type||baseDateType(d);
    if(isWeekday(d)&&(type==="instructional"||type==="inservice"||type==="earlydismissal"))count++;
    d=isoAddDays(d,1);
  }
  return count;
}
function countedDaysTotal(){
  const s=data.calendarSettings||{};
  return s.firstStudentDay&&s.lastStudentDay?countedDaysBefore(s.lastStudentDay):0;
}




function calendarColors(){
  const defaults={
    instructional:"#4f9d69",inservice:"#8b6bb8",noschool:"#cf5f5f",earlydismissal:"#d58a2b",
    nineWeeks:"#d59627",endNineWeeks:"#c77b20",
    trimester:"#3f7fc0",endTrimester:"#2f679e",
    semester:"#6c63a8",endSemester:"#514a8a",
    alternateSchedule:"#b05c8a",note:"#556070"
  };
  return {...defaults,...(data.calendarColors||{})};
}
function eventColor(date,key){
  return ((data.calendarOverrides||{})[date]?.colors||{})[key] || calendarColors()[key];
}
function hexToRgba(hex,alpha=.11){
  const h=String(hex||"").replace("#","").trim();
  if(!/^[0-9a-fA-F]{6}$/.test(h))return `rgba(255,255,255,${alpha})`;
  const n=parseInt(h,16),r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  return `rgba(${r},${g},${b},${alpha})`;
}
function calendarAppearance(date,info){
  // Alternate schedules get visual priority because they are the exception
  // that changes how an otherwise instructional day runs.
  let key="";
  if(info.schedule&&info.schedule!=="regular") key="alternateSchedule";
  else if(["instructional","inservice","noschool","earlydismissal"].includes(info.type)) key=info.type;
  if(!key)return {color:"#e0e4ec",background:"#f7f8fa"};
  const color=eventColor(date,key);
  return {color,background:hexToRgba(color,.11)};
}
// Calendar dates are saved as "YYYY-MM-DD" on the teacher's own clock. These two helpers
// are the one place the app turns a moment into a calendar date and back again.
// (toISOString() gives the date in UTC, which is already "tomorrow" after 8 PM Eastern.)
function localDateKey(d=new Date()){
  if(typeof d==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(d))return d;
  const x=d instanceof Date?d:new Date(d);if(isNaN(x))return "";
  return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-${String(x.getDate()).padStart(2,"0")}`;
}
// "YYYY-MM-DD" -> that day at local noon (noon keeps day arithmetic safe across DST changes).
function parseLocalDate(key){const m=String(key??"").match(/^(\d{4})-(\d{2})-(\d{2})/);return m?new Date(Number(m[1]),Number(m[2])-1,Number(m[3]),12,0,0,0):new Date(NaN);}
window.localDateKey=localDateKey;
function todayISO(){return localDateKey()}
window.openTodayNoteEditor=()=>{

  document.querySelector('#todayNoteModal')?.remove();
  document.body.insertAdjacentHTML('beforeend',`<div id="todayNoteModal" class="modalbg" onclick="if(event.target.id==='todayNoteModal')window.closeTodayNoteEditor()"><div class="modal todayNoteModal"><h3>Today's Notes</h3><p class="small">${esc(label)}</p><label>One note per line<textarea id="todayNoteText" rows="6" placeholder="Maddy — Dentist">${esc(notes)}</textarea></label><p class="row-actions"><button class="primary" onclick="window.saveTodayNotes()">Save</button> <button onclick="window.closeTodayNoteEditor()">Cancel</button></p></div></div>`);

};

window.saveTodayNotes=()=>{

function calendarNotesFor(date){return ((data.calendarOverrides||{})[date]||{}).notes||[]}

function academicMarkerHTML(kind,color,index){
  const defs={nineWeeks:["Q-Beg",`Begin Quarter ${index||""}`],endNineWeeks:["Q-End",`End Quarter ${index||""}`],trimester:["T-Beg",`Begin Trimester ${index||""}`],endTrimester:["T-End",`End Trimester ${index||""}`],semester:["S-Beg",`Begin Semester ${index||""}`],endSemester:["S-End",`End Semester ${index||""}`]};
  const [symbol,title]=defs[kind];
  return `<span class="markerCard" style="color:${color}" title="${title}">${symbol}</span>`;
}
function upcomingCalendarEvents(limit=8){
  const today=todayISO(), events=[];
  Object.keys(data.calendarOverrides||{}).filter(d=>d>=today).sort().forEach(date=>{
    const o=data.calendarOverrides[date]||{}, info=getDateInfo(date);
    if(info.schedule&&info.schedule!=="regular")events.push({date,label:bellScheduleName(info.schedule),kind:"Alternate Bell Schedule",color:eventColor(date,"alternateSchedule")});
    [["endNineWeeks","End of Nine Weeks","endNineWeeks"],["nineWeeks","Beginning of Nine Weeks","nineWeeks"],["endTrimester","End of Trimester","endTrimester"],["trimester","Beginning of Trimester","trimester"],["endSemester","End of Semester","endSemester"],["semester","Beginning of Semester","semester"]].forEach(([key,label,colorKey])=>{if(o[key])events.push({date,label,kind:"Academic Marker",color:eventColor(date,colorKey)})});
    if((o.notes||[]).length)events.push({date,label:o.notes[0],kind:"Note",color:eventColor(date,"note")});
    if(info.type==="inservice")events.push({date,label:"In-Service Day",kind:"School Calendar",color:eventColor(date,"inservice")});
    if(info.type==="noschool")events.push({date,label:"No School",kind:"School Calendar",color:eventColor(date,"noschool")});
    if(info.type==="earlydismissal")events.push({date,label:"Early Dismissal",kind:"School Calendar",color:eventColor(date,"earlydismissal")});
  });
  return events.sort((a,b)=>a.date.localeCompare(b.date)).slice(0,limit);
}
function calendarDayProgress(iso){
  const start=schoolStartDate(),end=schoolEndDate();
  if(!start||!end||iso<start||iso>end)return null;
  const info=getDateInfo(iso);
  if(!info.counted)return null;
  const current=countedDaysBefore(iso);
  const total=countedDaysTotal();
  return current?`${current}/${Math.max(0,total-current)}`:null;
}

function formStudentIds(f){
  const ids=new Set(f.targetStudentIds||[]);
  (f.targetClassIds||[]).forEach(cid=>{const c=data.classes.find(x=>x.id===cid);(c?.studentIds||[]).forEach(id=>ids.add(id));});
  (f.targetGroupIds||[]).forEach(gid=>{const g=data.groups.find(x=>x.id===gid);(g?.studentIds||[]).forEach(id=>ids.add(id));});
  return [...ids];
}
function orderedForms(){
  ensureForms();
  const alpha=[...data.forms].sort((a,b)=>(a.name||"").localeCompare(b.name||"",undefined,{sensitivity:"base"}));
  const saved=Array.isArray(data.formOrder)?data.formOrder:[];
  if(!saved.length)return alpha;
  const byId=new Map(data.forms.map(f=>[f.id,f]));
  const ordered=saved.map(id=>byId.get(id)).filter(Boolean);
  const missing=alpha.filter(f=>!saved.includes(f.id));
  return [...ordered,...missing];
}
window.moveForm=(id,direction)=>{
  const ids=orderedForms().map(f=>f.id);
  const i=ids.indexOf(id), j=i+direction;
  if(i<0||j<0||j>=ids.length)return;
  [ids[i],ids[j]]=[ids[j],ids[i]];
  data.formOrder=ids;
  save();render();
};
window.alphabetizeForms=()=>{
  data.formOrder=[];
  save();render();
};

window.saveForm=(id)=>{
  const name=$("#formName")?.value.trim();if(!name){alert("Please name the form or record.");return;}
  const vals=n=>[...document.querySelectorAll(`[name="${n}"]:checked`)].map(x=>x.value);
  const fields=[...document.querySelectorAll("#customFields .fieldDef")].map((d,i)=>{
    const label=(d.dataset.label||d.querySelector("input")?.value||"").trim();
    const type=d.dataset.type||d.querySelector("select")?.value||"text";
    const existingId=d.dataset.fieldId;
    const options=type==="dropdown"?(d.querySelector(".fieldOptions")?.value||"").split(/\n/).map(x=>x.trim()).filter(Boolean):[];
    return {id:existingId||("fld_"+Math.random().toString(36).slice(2)),label,type,options};

  const obj={name,description:$("#formDescription")?.value.trim()||"",dueDate:$("#formDueDate")?.value||"",targetClassIds:vals("targetClass"),targetGroupIds:vals("targetGroup"),targetStudentIds:vals("targetStudent"),fields};
  if(id){const old=data.forms.find(x=>x.id===id);if(old)Object.assign(old,obj);}
  else data.forms.push({id:"form_"+Math.random().toString(36).slice(2),...obj,records:{}});
  save();
  window.closeFormDialog();
  render();
};
window.updateDropdownField=(el,formId,studentId,fieldId)=>{
  const value=el.value;

    window.updateFormRecord(formId,studentId,fieldId,"__OTHER__:");
    const input=document.createElement("input");input.className="otherFieldInput";input.placeholder="Please specify...";
    input.onchange=()=>window.updateFormRecord(formId,studentId,fieldId,"__OTHER__:"+input.value);
    el.insertAdjacentElement("afterend",input);input.focus();
  }else window.updateFormRecord(formId,studentId,fieldId,value);

function gradeEligibleClasses(){
  ensureClassFields();
  return data.classes.filter(c=>c.graded&&!c.terms.some(x=>["t1","t2","t3"].includes(x)));
}
function gradeComponents(c){
  const terms=c.terms||[];
  const qs=terms.includes("fullYear")?["q1","q2","q3","q4"]:
    terms.includes("s1")?["q1","q2"]:terms.includes("s2")?["q3","q4"]:[];
  const comps=qs.map(q=>({id:q,label:q.toUpperCase(),kind:"quarter"}));
  if(c.giveMidterm)comps.push({id:"midterm",label:"Midterm",kind:"exam"});
  if(c.giveFinal)comps.push({id:"final",label:"Final",kind:"exam"});
  return comps;
}
function baseWeights(c){
  const comps=gradeComponents(c),qs=comps.filter(x=>x.kind==="quarter"),ex=comps.filter(x=>x.kind==="exam");
  const defaults={};
  if(ex.length===2){qs.forEach(x=>defaults[x.id]=1);ex.forEach(x=>defaults[x.id]=.5)}
  else if(ex.length===1){[...qs,...ex].forEach(x=>defaults[x.id]=1)}
  else qs.forEach(x=>defaults[x.id]=1);
  const saved=c.gradeWeights&&typeof c.gradeWeights==="object"?c.gradeWeights:{};
  const raw={};
  comps.forEach(x=>{const v=Number(saved[x.id]);raw[x.id]=Number.isFinite(v)&&v>=0?v:defaults[x.id]||0;});
  const total=Object.values(raw).reduce((s,v)=>s+v,0);
  if(total<=0)return comps.reduce((o,x)=>(o[x.id]=0,o),{});
  const w={};
  comps.forEach(x=>w[x.id]=raw[x.id]/total*100);
  return w;
}
function currentAverage(c,sid){
  const grades=c.grades?.[sid]||{},w=baseWeights(c);
  const entered=Object.keys(w).filter(id=>grades[id]!==""&&grades[id]!==undefined&&grades[id]!==null&&!Number.isNaN(Number(grades[id])));
  if(!entered.length)return "";
  const totalW=entered.reduce((s,id)=>s+w[id],0);
  return entered.reduce((s,id)=>s+Number(grades[id])*w[id],0)/totalW;
}
function gradeLetter(avg,c=null){
  if(avg===""||avg===null||Number.isNaN(Number(avg)))return "";
  const n=Math.round(Number(avg)),scale=c?.gradeScale&&typeof c.gradeScale==="object"?c.gradeScale:{A:90,B:80,C:70,D:60};
  if(n>=Number(scale.A??90))return "A";
  if(n>=Number(scale.B??80))return "B";
  if(n>=Number(scale.C??70))return "C";
  if(n>=Number(scale.D??60))return "D";
  return "F";
}
function formatCurrentAverage(avg,c=null){
  if(avg===""||avg===null||Number.isNaN(Number(avg)))return {text:"—",isF:false};
  const rounded=Math.round(Number(avg)),letter=gradeLetter(avg,c);
  return {text:`${rounded}% ${letter}`,isF:letter==="F"};
}
function recommendationFor(c,avg){
  if(avg===""||avg===null||!c.usesRecommendations)return "";
  const n=Math.round(Number(avg));

function setupMarkingPeriods(){
  const d=window.setupDraft?.calendar||{};
  const mp=d.markingPeriods||{};
  const make=(arr,count,prefix)=>Array.from({length:count},(_,i)=>({
    name:arr?.[i]?.name||`${prefix} ${i+1}`,
    start:String(arr?.[i]?.start||""),
    end:String(arr?.[i]?.end||""),
    _autoStart:arr?.[i]?._autoStart!==false,
    _autoEnd:arr?.[i]?._autoEnd!==false
  }));
  mp.quarters=make(mp.quarters,4,"Quarter");

function setupNextSchoolDay(date){
  if(!setupDateOk(date))return "";
  const c=window.setupDraft?.calendar||{};
  const blocked=new Set([
    ...setupCalendarList('noSchoolDates').map(x=>x.date),
    ...setupCalendarList('inserviceDates').map(x=>x.date)
  ]);
  let d=parseLocalDate(date);
  for(let i=0;i<370;i++){
    d.setDate(d.getDate()+1);
    const iso=isoDate(d);
    const dow=d.getDay();
    if(dow!==0&&dow!==6&&!blocked.has(iso))return iso;
  }
  return "";
}
function setupDeriveMarkingPeriods(){
  const c=window.setupDraft?.calendar||{};
  const mp=setupMarkingPeriods();
  const markers=setupMarkers();
  const first=setupDateOk(c.firstStudentDay)?c.firstStudentDay:"";
  const last=setupDateOk(c.lastStudentDay)?c.lastStudentDay:"";
  const findEnd=(type,index)=>{
    const ordinal=index===1?'1st|first':index===2?'2nd|second':index===3?'3rd|third':'4th|fourth';
    const kind=type==='quarter'?'endNineWeeks':type==='semester'?'endSemester':'endTrimester';
    return markers.find(m=>m.kind===kind&&new RegExp(ordinal,'i').test(m.label||''))?.date||"";
  };
  [['quarters',4,'quarter'],['semesters',2,'semester'],['trimesters',3,'trimester']].forEach(([key,count,type])=>{
    const arr=mp[key];
    for(let i=0;i<count;i++){
      if(i===0&&first&&arr[i]._autoStart)arr[i].start=first;
      const end=findEnd(type,i+1);
      if(end&&arr[i]._autoEnd)arr[i].end=end;
      if(i===count-1&&last&&arr[i]._autoEnd)arr[i].end=last;
      if(i>0&&setupDateOk(arr[i-1].end)&&arr[i]._autoStart){
        const next=setupNextSchoolDay(arr[i-1].end);
        if(next)arr[i].start=next;
      }
    }
  });
  return mp;
}

function setupYearBounds(){
  const c=window.setupDraft?.calendar||{};
  let start=setupDateOk(c.firstStudentDay)?c.firstStudentDay:"";
  let end=setupDateOk(c.lastStudentDay)?c.lastStudentDay:"";
  const dates=setupExceptionEntries().map(x=>x.date).filter(setupDateOk).sort();
  if(!start&&dates.length)start=dates[0];
  if(!end&&dates.length)end=dates[dates.length-1];
  if(!start){const now=new Date();start=`${now.getFullYear()}-08-01`;}
  if(!end){const y=Number(start.slice(0,4))+1;end=`${y}-06-30`;}
  return {start,end};
}
function setupMonthHTML(year,month){
  const first=new Date(year,month-1,1),days=new Date(year,month,0).getDate();
  const title=first.toLocaleDateString(undefined,{month:'long',year:'numeric'});
  let html=`<div class="setupYearMonth"><h5>${title}</h5><div class="setupYearWeekdays">${['S','M','T','W','T','F','S'].map(x=>`<span>${x}</span>`).join('')}</div><div class="setupYearDays">`;
  for(let i=0;i<first.getDay();i++)html+=`<span class="setupYearBlank"></span>`;
  for(let d=1;d<=days;d++){
    const date=`${year}-${String(month).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const ex=setupFindException(date);
    const c=window.setupDraft?.calendar||{};
    const inYear=(!c.firstStudentDay||date>=c.firstStudentDay)&&(!c.lastStudentDay||date<=c.lastStudentDay);
    const marker=(setupMarkers().some(m=>m.date===date));
    const cls=ex?`hasException ${ex.type}`:inYear?'schoolDay':'outsideDay';
    html+=`<button type="button" class="setupYearDay ${cls}" title="${esc(ex?`${setupExceptionLabel(ex.type)}${ex.label?' — '+ex.label:''}`:'Click to add an exception')}" onclick="window.setupOpenDateEditor('${date}')"><b>${d}</b>${marker?'<span class="setupYearMarker">•</span>':''}</button>`;
  }
  html+='</div></div>';
  return html;
}
function setupYearAtAGlanceHTML(){
  const {start,end}=setupYearBounds();
  const sy=Number(start.slice(0,4)),sm=Number(start.slice(5,7)),ey=Number(end.slice(0,4)),em=Number(end.slice(5,7));
  const months=[];let y=sy,m=sm;
  for(let i=0;i<18;i++){months.push([y,m]);if(y===ey&&m===em)break;m++;if(m>12){m=1;y++;}}
  return `<div class="setupYearAtAGlance"><div class="setupYearHint"><b>Click any date to add or edit an exception.</b><span class="small">Dates outside the student year are shown softly; existing exceptions are color-coded.</span></div><div class="setupYearGrid">${months.map(x=>setupMonthHTML(x[0],x[1])).join('')}</div></div>`;
}

window.extractSetupDocument=async kind=>{
  const input=document.getElementById(kind==='calendar'?'setupCalendarFile':'setupBellFile');
  const file=input?.files?.[0];
  if(!file){alert(`Please choose a ${kind==='calendar'?'district calendar':'bell schedule'} file first.`);return;}
  if(file.size>15*1024*1024){alert('Please use a document 15 MB or smaller.');return;}
  const status=document.getElementById(kind==='calendar'?'setupCalendarStatus':'setupBellStatus');
  if(status)status.textContent='Reading with AI…';
  try{
    const token=currentUser?.getIdToken?await currentUser.getIdToken():'';
    if(!token)throw new Error('You must be signed in.');
    const form=new FormData();form.append('file',file,file.name||`${kind}.pdf`);form.append('mode',`setup_${kind}`);
    const res=await fetch(ACCOMMODATION_AI_ENDPOINT,{method:'POST',headers:{Authorization:`Bearer ${token}`},body:form});
    const payload=await res.json().catch(()=>({}));
    if(!res.ok)throw new Error(payload.error||`Setup import failed (${res.status}).`);
    window.setupDraft=window.setupDraft||{};window.setupDraft[kind]=payload;
    if(kind==='calendar'){
      const c=window.setupDraft.calendar||{};

function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a}
function canJoinGroup(id,group){return !group.some(other=>isRestrictedPair(id,other))}
window.generateGroups=()=>{
  ensureClassroomTools();const size=Math.max(2,Math.floor(Number($("#groupSize")?.value)||3));const ids=shuffle(currentToolRoster().map(s=>s.id));
  if(!ids.length){alert("There are no students available.");return;}
  const groups=[];const difficult=[];
  for(const id of ids){
    let candidates=groups.filter(g=>g.length<size&&canJoinGroup(id,g));
    candidates.sort((a,b)=>a.length-b.length);
    if(candidates.length)candidates[0].push(id);else difficult.push(id);
  }
  for(const id of difficult){
    let candidates=groups.filter(g=>canJoinGroup(id,g));candidates.sort((a,b)=>a.length-b.length);
    if(candidates.length&&candidates[0].length<size+1)candidates[0].push(id);else groups.push([id]);
  }
  data.classroomTools.groups=groups;save();render();
}

function bindInterval(fn,ms){const id=setInterval(fn,ms);bindIntervals.push(id);return id;}

  const tickClassLeft=()=>{
    const block=currentScheduleBlock(),times=scheduleBlockTimes(block),ms=timeLeftInBlock(),next=nextScheduleBlock(),until=timeUntilNextBlock(),nextTimes=scheduleBlockTimes(next);
    document.querySelectorAll('[data-tool-live="classleft"]').forEach(el=>el.textContent=ms===null?"—":Math.max(0,Math.ceil(ms/60000)));
    document.querySelectorAll('[data-sidebar-block]').forEach(el=>el.textContent=block?.label||"");
    document.querySelectorAll('[data-sidebar-range]').forEach(el=>el.textContent=times?`${times.startText} – ${times.endText}`:"No active period");
    document.querySelectorAll('[data-tool-block]').forEach(el=>el.textContent=block?.label||(next?`Next: ${next.label}`:"No active period"));
    document.querySelectorAll('[data-tool-range]').forEach(el=>el.textContent=times?`${times.startText} – ${times.endText}`:"");
    document.querySelectorAll('[data-next-class-countdown]').forEach(el=>el.textContent=until===null?"—":formatClock(until));
    document.querySelectorAll('[data-next-class-block]').forEach(el=>el.textContent=next?.label||"No upcoming period");
    document.querySelectorAll('[data-next-class-range]').forEach(el=>el.textContent=nextTimes?`${nextTimes.startText} – ${nextTimes.endText}`:"");
    // Re-render when the state crosses from a passing period into a scheduled block
    // (or vice versa), so the sidebar switches between the two layouts automatically.
    const waitingState=!block&&until!==null;
    const sidebar=document.querySelector('.sidebarTimeCard');
    if(sidebar){const renderedWaiting=sidebar.classList.contains('isWaiting');if(renderedWaiting!==waitingState)render();}
    };tickClassLeft();bindInterval(tickClassLeft,1000);

// A backup must look like a Teacher Dashboard backup before it may replace anything.
function validateDashboardBackup(x){
  if(!x||typeof x!=="object"||Array.isArray(x))return "it is not a Teacher Dashboard backup file.";
  if(!Array.isArray(x.classes)||!Array.isArray(x.students))return "it doesn't contain the classes and students that every Teacher Dashboard backup has.";
  for(const k of ["groups","forms","accommodations","accommodationSources","events","notes","announcements","bellSchedules","buttons","gradeCourses"])if(k in x&&!Array.isArray(x[k]))return `its "${k}" section is damaged.`;
  for(const k of ["lessonPlans","calendarSettings","calendarOverrides","masterSchedules"])if(k in x&&(!x[k]||typeof x[k]!=="object"||Array.isArray(x[k])))return `its "${k}" section is damaged.`;
  if(x.masterSchedules&&"years" in x.masterSchedules&&(!x.masterSchedules.years||typeof x.masterSchedules.years!=="object"||Array.isArray(x.masterSchedules.years)))return 'its "masterSchedules" section is damaged.';
  if(x.classes.some(c=>!c||typeof c!=="object"||!c.id))return "some of its class records are damaged.";
  if(x.students.some(s=>!s||typeof s!=="object"||!s.id))return "some of its student records are damaged.";
  const known=["bellSchedules","calendarSettings","lessonPlans","buttons","accommodations","events","notes","calendarOverrides","sidebarOrder","setupComplete","groups","forms"].filter(k=>k in x).length;
  if(known<3)return "it doesn't look like a Teacher Dashboard backup (most of the usual sections are missing).";
  return "";
}

function lessonRowClassAvailable(cls,date,weekday){
  const info=getDateInfo(date);if(info.type!=='instructional'||!classMeetsOnWeekday(cls,weekday))return false;
  if(info.schedule&&info.schedule!=='regular'){
    const sch=(data.bellSchedules||[]).find(s=>s.id===info.schedule);
    if(sch&&Array.isArray(sch.periods)){
      const nums=sch.periods.map(x=>classPeriodNumber(x[0])).filter(Boolean);
      const cp=(classPeriodLabel(cls,weekday).match(/\d+/g)||[]).map(Number);
      if(nums.length&&cp.length&&!cp.some(n=>nums.includes(n)))return false;
    }
  }
  return true;
}
function lessonRowAvailableOnDate(row,date,weekday){
  if(row.type==='custom'){
    const info=getDateInfo(date);if(info.type!=='instructional'||!(row.days||[]).includes(Number(weekday)))return false;
    if(info.schedule&&info.schedule!=='regular'&&row.period){const sch=(data.bellSchedules||[]).find(s=>s.id===info.schedule);if(sch&&Array.isArray(sch.periods)){const nums=sch.periods.map(x=>classPeriodNumber(x[0])).filter(Boolean);if(nums.length&&!nums.includes(Number(row.period)))return false;}}
    return true;
  }
  return (row.classIds||[]).some(id=>lessonRowClassAvailable(data.classes.find(c=>c.id===id),date,weekday));
}
function lessonSubState(row,date,weekday){
  const sub=(data.calendarOverrides?.[date]||{}).subCoverage||'none';if(sub==='none'||!sub)return 'none';
  if(row.type==='custom'){if(sub==='full')return 'all';const p=Number(row.period)||0;if(!p)return 'all';return (sub==='am'?p<=4:p>=5)?'all':'none';}
  const meeting=(row.classIds||[]).map(id=>data.classes.find(c=>c.id===id)).filter(c=>lessonRowClassAvailable(c,date,weekday));
  if(!meeting.length)return 'none';
  if(sub==='full')return 'all';
  const affected=meeting.filter(c=>{const nums=(classPeriodLabel(c,weekday).match(/\d+/g)||[]).map(Number);if(!nums.length)return true;return nums.some(n=>sub==='am'?n<=4:n>=5)});
  if(!affected.length)return 'none';return affected.length===meeting.length?'all':'partial';
}
